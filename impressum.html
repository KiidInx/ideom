<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum — Flux Studio</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0a0a08; --surface: #171715; --border: #2e2e2a;
    --flux: #e8d5a3; --flux2: #c4a96d;
    --text: #e8e6e0; --text-mid: #9a9a92;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: Georgia, serif; line-height: 1.7;
    max-width: 720px; margin: 0 auto; padding: 48px 20px 80px;
  }
  .tag {
    font-family: monospace; font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--flux2); margin-bottom: 14px;
  }
  h1 { font-size: 30px; color: #fff; margin-bottom: 28px; }
  h2 { font-size: 18px; color: var(--flux); margin: 28px 0 10px; }
  p { font-size: 15px; color: var(--text-mid); margin-bottom: 14px; }
  p strong { color: var(--text); }
  a { color: var(--flux); }
  .zurueck {
    display: inline-block; margin-top: 40px;
    font-family: monospace; font-size: 13px;
    color: var(--text-mid); text-decoration: none;
  }
  .zurueck:hover { color: var(--flux); }
</style>
</head>
<body>
  <div class="tag">Flux Studio</div>
  <h1>Impressum</h1>

  <h2>Angaben gemäß § 5 DDG</h2>
  <p>
    <strong>[VORNAME NACHNAME]</strong><br>
    [Straße Hausnummer]<br>
    [PLZ Ort]<br>
    Deutschland
  </p>

  <h2>Kontakt</h2>
  <p>E-Mail: <a href="mailto:[E-MAIL-ADRESSE]">[E-MAIL-ADRESSE]</a></p>

  <h2>Verantwortlich für den Inhalt</h2>
  <p>[VORNAME NACHNAME], Anschrift wie oben.</p>

  <a class="zurueck" href="index.html">← Zurück zur Startseite</a>
</body>
</html>
